<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赵州桥为什么稳 - 受力传递演示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">计算机设计大赛 · 微课交互页</p>
        <h1>赵州桥为什么稳：从拱桥结构到受力传递</h1>
      </div>
      <div class="mode-toggle" role="tablist" aria-label="结构对比切换">
        <button class="mode-btn active" data-mode="arch" role="tab" aria-selected="true">拱桥结构</button>
        <button class="mode-btn" data-mode="beam" role="tab" aria-selected="false">平梁结构</button>
      </div>
    </header>

    <main class="content-grid">
      <section class="visual-panel" aria-label="桥梁受力示意图">
        <svg id="bridgeCanvas" viewBox="0 0 1000 520" aria-labelledby="diagramTitle">
          <title id="diagramTitle">桥梁结构与受力路径示意图</title>

          <defs>
            <linearGradient id="bridgeDeckGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e9eef9" />
              <stop offset="100%" stop-color="#cfd8eb" />
            </linearGradient>
            <linearGradient id="archGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#4b72c2" />
              <stop offset="100%" stop-color="#2a4d9f" />
            </linearGradient>
            <marker id="arrowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
              <polygon points="0 0, 9 4.5, 0 9" fill="#ff8f46" />
            </marker>
          </defs>

          <rect x="0" y="420" width="1000" height="100" class="river-bed" />

          <rect id="leftAbutment" x="80" y="220" width="100" height="210" rx="10" class="abutment" />
          <rect id="rightAbutment" x="820" y="220" width="100" height="210" rx="10" class="abutment" />

          <rect id="bridgeDeck" x="145" y="160" width="710" height="34" rx="6" fill="url(#bridgeDeckGradient)" stroke="#9faecd" stroke-width="2" />

          <path id="mainArch"
                d="M 160 346 Q 500 120 840 346"
                fill="none"
                stroke="url(#archGradient)"
                stroke-width="32"
                stroke-linecap="round" />

          <path id="smallArchLeft" d="M 300 342 Q 355 275 410 342" class="small-arch" />
          <path id="smallArchRight" d="M 590 342 Q 645 275 700 342" class="small-arch" />

          <path id="beamBody" d="M 155 210 L 845 210 L 815 342 L 185 342 Z" class="beam-body hidden" />
          <path id="beamDeflect" d="M 165 212 Q 500 255 835 212" class="beam-deflect hidden" />

          <g id="loadNodes">
            <circle cx="430" cy="112" r="17" class="load-dot" />
            <circle cx="500" cy="104" r="20" class="load-dot focus" />
            <circle cx="570" cy="112" r="17" class="load-dot" />
          </g>

          <path id="forcePathLeft" d="M 500 122 Q 445 205 370 250 Q 275 305 175 346" class="force-path" />
          <path id="forcePathRight" d="M 500 122 Q 555 205 630 250 Q 725 305 825 346" class="force-path" />
          <path id="forcePathDown" d="M 500 122 L 500 184" class="force-path vertical" />

          <line id="beamLoadArrow" x1="500" y1="122" x2="500" y2="300" class="beam-force hidden" marker-end="url(#arrowHead)" />

          <text x="500" y="62" text-anchor="middle" class="diagram-label">桥面荷载</text>
          <text x="500" y="402" text-anchor="middle" class="diagram-label">主拱（受压传力）</text>
          <text x="500" y="190" text-anchor="middle" class="diagram-label subtle" id="modeHint">力沿主拱传向两侧桥台</text>
          <text x="355" y="274" text-anchor="middle" class="diagram-label small" id="smallArchLabelL">小拱 / 敞肩区</text>
          <text x="645" y="274" text-anchor="middle" class="diagram-label small" id="smallArchLabelR">小拱 / 敞肩区</text>
        </svg>
      </section>

      <aside class="explain-panel">
        <section class="controls">
          <button id="playBtn" class="action-btn primary">开始演示</button>
          <button id="resetBtn" class="action-btn">重置演示</button>
          <button id="smallArchBtn" class="action-btn accent">查看小拱作用</button>
        </section>

        <section class="explanation" id="explanationBox">
          <h2>讲解说明区</h2>
          <p id="explanationTitle">什么是主拱？</p>
          <p id="explanationText">主拱是拱桥最核心的受力结构。桥面荷载先作用到拱圈，再由拱圈把压力传向两端桥台。</p>
        </section>

        <section class="legend">
          <h3>图例</h3>
          <ul>
            <li><span class="swatch orange"></span> 动态箭头：荷载/力的方向</li>
            <li><span class="swatch blue"></span> 主拱路径：受压传力通道</li>
            <li><span class="swatch slate"></span> 桥台：最终受力支撑</li>
          </ul>
        </section>
      </aside>
    </main>
  </div>

  <div id="smallArchModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h3 id="modalTitle">赵州桥小拱 / 敞肩的关键作用</h3>
      <div class="modal-points">
        <article>
          <h4>减轻自重</h4>
          <p>拱肩开孔减少无效石料，降低桥身重量，让主拱承担更合理的压力。</p>
        </article>
        <article>
          <h4>洪水分流</h4>
          <p>洪水来时，小拱可分流过水，减小对主桥和桥台的冲击，提高整体稳定性。</p>
        </article>
      </div>
      <button id="closeModalBtn" class="action-btn primary">我明白了</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
